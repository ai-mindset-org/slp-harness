# поиск конкурентов · настройка для агента-исследователя
# читает: people/{role} агент исследователь.md, tools/{tool} exa.md
# пишет: context/{context} конкурент <имя>.md и asks/{ask} кто конкуренты рядом.md
# правит маркетолог; рутина «конкуренты по понедельникам» берёт эти же настройки

city: Москва
from: context/{context} паспорт комплекса.md   # адрес «от нас» берётся из паспорта
radius_km: 40                                  # дальше гость не едет ради бани на вечер

formats:
  - банный комплекс с общим отделением
  - приватная баня или зал на час
  - банный клуб с парениями

criteria:
  include:
    - есть публичный прайс или цена на картах
    - работает сейчас: свежие отзывы за последние 3 месяца
    - есть карточка на Яндекс Картах или в 2ГИС
  exclude:
    - сауна при фитнес-клубе или гостинице: вход с абонементом или номером
    - закрыт, переехал или карточка без отзывов больше года
    - за радиусом от нас

sources:
  search: Exa                                   # .mcp.json, ключ в EXA_API_KEY, не в файлах
  prices: официальный сайт и прайс, снимок страницы с датой
  ratings: [Яндекс Карты, 2ГИС]
  reviews: [Яндекс Карты, 2ГИС, Zoon, Отзовик]
  include_domains: [yandex.ru, 2gis.ru, zoon.ru, otzovik.com]

fields: [адрес, часы, вход_будни, вход_выходные, час_зала_будни, час_зала_выходные, рейтинг, оценок, темы_отзывов, каналы, источник, дата]

limit:
  complexes: 16        # карточек в context/
  queries: 40          # запросов к Exa за один прогон
  per_complex: 3       # уточнений на один комплекс

not_found: «не найдено»   # цифры не придумываем
